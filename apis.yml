aid: color-genomics
url: https://raw.githubusercontent.com/api-evangelist/color-genomics/refs/heads/main/apis.yml
name: Color Health
kind: company
description: Color Health (founded as Color Genomics in 2015) is a population health
  technology company that operates a nationwide, oncologist-led Virtual Cancer Clinic
  and delivers population-scale precision health programs - hereditary cancer and
  cardiovascular genetic testing, pharmacogenomics, cancer early detection and
  screening, and clinical care management - for employers, unions, health plans,
  governments, and public health institutions. Color does NOT publish a public,
  self-service developer API. Access to its platform is enterprise/partner-gated and
  contracted directly with organizations; data exchange with health systems and EHRs
  is handled through interoperability partners (e.g. Redox) using FHIR/HL7 rather
  than an open developer portal. The APIs listed here are logical, honestly-modeled
  surfaces (endpointsModeled) that describe how such a program is typically
  integrated - they are not confirmed public endpoints.
