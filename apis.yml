apis:
- aid: color-genomics:color-orders-kits-api
  name: Color Orders & Kits API (Modeled)
  tags:
  - Orders
  - Kits
  - Genetic Testing
  - Modeled
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.color.com/
  endpointsModeled: true
  description: Modeled surface for placing and tracking genetic test orders and
    sample-collection kits within a Color population health program - creating an
    order for a participant, assigning and shipping a kit, and tracking kit status
    from activation through lab receipt. Color does not publish this as a public API;
    ordering is contracted and integrated per enterprise/health-system engagement.
- aid: color-genomics:color-results-api
  name: Color Results API (Modeled)
  tags:
  - Results
  - Reports
  - Genomics
  - Modeled
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.color.com/
  endpointsModeled: true
  description: Modeled surface for retrieving clinical genetic test results and
    reports (hereditary cancer, cardiovascular, pharmacogenomics) for participants in
    a program. In practice, results delivery to health systems is handled through
    FHIR/HL7 interoperability partners such as Redox rather than an open Color
    developer API.
- aid: color-genomics:color-members-participants-api
  name: Color Members & Participants API (Modeled)
  tags:
  - Members
  - Participants
  - Enrollment
  - Modeled
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.color.com/
  endpointsModeled: true
  description: Modeled surface for enrolling and managing the members/participants of
    an employer, union, or public-health population - eligibility, enrollment status,
    demographics, and consent. Not a public API; membership integration is configured
    per contracted program.
- aid: color-genomics:color-programs-api
  name: Color Programs API (Modeled)
  tags:
  - Programs
  - Population Health
  - Screening
  - Modeled
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.color.com/
  endpointsModeled: true
  description: Modeled surface for configuring and reporting on population health
    programs - cancer early detection and screening campaigns, risk-based care
    pathways, and aggregate program engagement/outcomes for a sponsoring
    organization. Provided as a modeled surface only; Color exposes this through
    contracted program dashboards and services, not a public developer API.
- aid: color-genomics:color-clinical-data-api
  name: Color Clinical Data API (Modeled)
  tags:
  - Clinical Data
  - FHIR
  - Interoperability
  - Modeled
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.redoxengine.com/healthcare-product/color/
  endpointsModeled: true
  description: Modeled surface for exchanging clinical data (observations, diagnostic
    reports, care-gap and screening status) between Color and a health system's EHR.
    Real-world exchange uses FHIR/HL7 through interoperability partners such as Redox;
    Color itself does not publish an open FHIR endpoint or developer portal.
